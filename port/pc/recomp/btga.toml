# N64Recomp compatibility configuration. Inputs are generated locally by
# prepare.sh from the matching worktree and the user's verified ROM.
[input]
entrypoint = 0x80071000
symbols_file_path = "input/functions.toml"
rom_file_path = "input/battletanx_ga.z64"
output_func_path = "generated/functions"
output_binary_path = "generated/battletanx_ga.bin"
functions_per_output_file = 50
uses_mips3_float_mode = true

[patches]
stubs = [
    # Host instruction caches are coherent; this boot-time N64 cache sweep is unnecessary.
    "func_80078DFC",
    "func_80078E18",
    "func_8007919C",
    "func_80079260",
    "__osExceptionPreamble_80104FA0",
    "__osException_80104FB0",
]
ignored = [
    "__udivdi3_recomp",
    "__umoddi3_recomp",
    # The original relies on interrupt preemption inside a conditional busy-wait.
    # The host runtime schedules N64 threads cooperatively, so replace it with a
    # semantically equivalent yielding poll in runtime_patches.cpp.
    "func_80098B40",
    "func_800A1384",
    "func_80079FF0",
    "func_8007A818",
    # Replaced so PC music/effects sliders scale libmus' two existing master
    # buses independently while preserving every in-game volume adjustment.
    "MusSetMasterVolume",
]

# A pre-boot online session must not seed gameplay from each machine's wall
# clock. Both peers negotiate this value before either enters N64 code.
[[patches.hook]]
func = "func_8009DA34"
before_vram = 0x8009DA34
text = """
    { extern void btga_online_seed_step(uint8_t *rdram, recomp_context *ctx); btga_online_seed_step(rdram, ctx); }
"""

# Rollback cannot be enabled until the translated gameplay update proves that
# it is a deterministic, re-entrant tick.  These hooks are dormant unless the
# BTGA_REPLAY_EQUIVALENCE_PROBE environment variable is set.  The probe saves
# complete RDRAM and CPU context at entry, executes one active-gameplay tick,
# restores it, executes the same tick again with network admission suppressed,
# and compares the two results.
[[patches.hook]]
func = "func_8009C524"
before_vram = 0x8009C524
text = """
    { extern void btga_replay_probe_begin(uint8_t *rdram, recomp_context *ctx); btga_replay_probe_begin(rdram, ctx); }
"""

# A dedicated authority has no local front end. After retail initializes its
# runtime services, native server orchestration supplies the four-player match
# configuration and enters gameplay through the normal translated level init.
[[patches.hook]]
func = "func_8009D270"
before_vram = 0x8009D390
text = """
    { extern void btga_dedicated_match_bootstrap(uint8_t *rdram, recomp_context *ctx); btga_dedicated_match_bootstrap(rdram, ctx); }
"""

[[patches.hook]]
func = "func_8009D3A4"
before_vram = 0x8009D478
text = """
    { extern int btga_dedicated_client_loop_ready(uint8_t*); extern void btga_dedicated_client_run_loop(uint8_t*, recomp_context*); extern int btga_dedicated_enabled(); extern void btga_dedicated_run_loop(uint8_t*, recomp_context*); if (btga_dedicated_client_loop_ready(rdram)) { btga_dedicated_client_run_loop(rdram, ctx); return; } if (btga_dedicated_enabled()) { btga_dedicated_run_loop(rdram, ctx); return; } }
"""

[[patches.hook]]
func = "func_8009C524"
before_vram = 0x8009D120
text = """
    { extern void btga_replay_probe_end(uint8_t *rdram, recomp_context *ctx); btga_replay_probe_end(rdram, ctx); }
"""

# Online peers must advance gameplay from the same emulated frame clock. The
# retail update derives D_8021945C and D_80219488 from osGetTime(), which is
# intentionally different on every host and therefore cannot be used by
# deterministic netplay. Preserve offline timing and replace only the online
# result with one 30 Hz game tick per active update.
[[patches.hook]]
func = "func_80099FE8"
before_vram = 0x80099FE8
text = """
    { extern void btga_online_clock_begin(uint8_t *rdram, recomp_context *ctx); btga_online_clock_begin(rdram, ctx); }
"""

# osGetTime returns in v0/v1 at 0x8009A004. Dedicated and legacy online
# sessions replace that host-specific sample with a synthetic 30 Hz N64 clock
# before the translated routine consumes it, keeping its history and branch
# decisions deterministic on every machine.
[[patches.hook]]
func = "func_80099FE8"
before_vram = 0x8009A004
text = """
    { extern void btga_online_clock_source(uint8_t *rdram, recomp_context *ctx); btga_online_clock_source(rdram, ctx); }
"""

[[patches.hook]]
func = "func_80099FE8"
before_vram = 0x8009A4C0
text = """
    { extern void btga_online_clock_end(uint8_t *rdram, recomp_context *ctx); btga_online_clock_end(rdram, ctx); }
"""

# func_800F11D0 truncates the frame step before decrementing shield-hit flash
# life. At an exact host 60 Hz that value can stay below 1.0, producing a zero
# decrement and an accumulating shell of translucent polygons around vehicles.
[[patches.hook]]
func = "func_800F11D0"
before_vram = 0x800F1268
text = """
    { extern void btga_shield_flash_step(uint8_t *rdram, recomp_context *ctx); btga_shield_flash_step(rdram, ctx); }
"""

# Other sites truncate the same sub-one host frame step and can consequently
# stall steering deadlines or end-of-level score counters.
[[patches.hook]]
func = "func_80087DF4"
before_vram = 0x80087E90
text = """
    { extern void btga_turn_step(uint8_t *rdram, recomp_context *ctx); btga_turn_step(rdram, ctx); }
"""

