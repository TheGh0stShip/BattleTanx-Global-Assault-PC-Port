# N64Recomp compatibility configuration. Inputs are generated locally by
# prepare.sh from the matching worktree and the user's verified ROM.
[input]
entrypoint = 0x80071000
symbols_file_path = "input/functions.toml"
rom_file_path = "input/battletanx_ga.z64"
output_func_path = "generated/functions"
output_binary_path = "generated/battletanx_ga.bin"
functions_per_output_file = 50
uses_mips3_float_mode = true

[patches]
stubs = [
    # Host instruction caches are coherent; this boot-time N64 cache sweep is unnecessary.
    "func_80078DFC",
    "func_80078E18",
    "func_8007919C",
    "func_80079260",
    "__osExceptionPreamble_80104FA0",
    "__osException_80104FB0",
]
ignored = [
    "__udivdi3_recomp",
    "__umoddi3_recomp",
    # The original relies on interrupt preemption inside a conditional busy-wait.
    # The host runtime schedules N64 threads cooperatively, so replace it with a
    # semantically equivalent yielding poll in runtime_patches.cpp.
    "func_80098B40",
    "func_800A1384",
    "func_80079FF0",
    "func_8007A818",
]

# func_800F11D0 truncates the frame step before decrementing shield-hit flash
# life. At an exact host 60 Hz that value can stay below 1.0, producing a zero
# decrement and an accumulating shell of translucent polygons around vehicles.
[[patches.hook]]
func = "func_800F11D0"
before_vram = 0x800F1268
text = """
    { extern void btga_shield_flash_step(uint8_t *rdram, recomp_context *ctx); btga_shield_flash_step(rdram, ctx); }
"""

# Other sites truncate the same sub-one host frame step and can consequently
# stall steering deadlines or end-of-level score counters.
[[patches.hook]]
func = "func_80087DF4"
before_vram = 0x80087E90
text = """
    { extern void btga_turn_step(uint8_t *rdram, recomp_context *ctx); btga_turn_step(rdram, ctx); }
"""

[[patches.instruction]]
func = "func_80087DF4"
vram = 0x80087E94
value = 0x30C6FFFF

[[patches.hook]]
func = "func_80088030"
before_vram = 0x800885CC
text = """
    { extern void btga_deadline_step(uint8_t *rdram, recomp_context *ctx); btga_deadline_step(rdram, ctx); }
"""

[[patches.hook]]
func = "func_800CF41C"
before_vram = 0x800CF478
text = """
    { extern void btga_score_count_step(uint8_t *rdram, recomp_context *ctx); btga_score_count_step(rdram, ctx); }
"""

