# The intro/credits camera can build a degenerate near=16, far=0 projection
# before gameplay has initialized the draw-distance global. Fixed-point N64
# clipping tolerated that boundary; RT64 floating-point clipping flickers.
[[patches.hook]]
func = "func_800D25E0"
before_vram = 0x800D2AFC
text = """
    { extern void btga_cutscene_far_plane(uint8_t *rdram, recomp_context *ctx); btga_cutscene_far_plane(rdram, ctx); }
"""

